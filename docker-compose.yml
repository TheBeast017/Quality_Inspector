version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: inspection-db
    environment:
      POSTGRES_DB: inspection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: inspection-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inspection
      DB_USER: postgres
      DB_PASSWORD: postgres
      USE_SQLITE: "false"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      INFERENCE_DEVICE: cuda
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inspection-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  mlflow:
    image: python:3.11-slim
    container_name: inspection-mlflow
    command: >
      sh -c "pip install mlflow psycopg2-binary &&
             mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://postgres:postgres@postgres:5432/mlflow --default-artifact-root /mlflow/artifacts"
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  mlflow_data: