[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-ai-inspection"
version = "0.1.0"
description = "AI-powered automated visual inspection and defect severity assessment for manufactured components"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kartikay Tewari" }]
dependencies = [
    # torch / torchvision are installed from the CUDA index, not here.
    "ultralytics>=8.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "pillow>=10.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "pgvector>=0.2.0",
    "mlflow>=2.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"